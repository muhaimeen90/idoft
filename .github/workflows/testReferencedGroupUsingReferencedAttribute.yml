name: "Test - nifi: LdapUserGroupProviderTest#testReferencedGroupUsingReferencedAttribute"

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  confirm-flaky:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Clone nifi at specific SHA
        run: |
          git clone https://github.com/apache/nifi.git
          cd nifi
          git checkout 2bd752d868a8f3e36113b078bb576cf054e945e8

      - name: Build module and dependencies
        working-directory: nifi
        run: |
          mvn clean install -DskipTests \
            -pl nifi-nar-bundles/nifi-ldap-iaa-providers-bundle/nifi-ldap-iaa-providers -am 

      - name: Run test WITHOUT NonDex (should PASS)
        working-directory: nifi
        run: |
          mvn test \
            -pl nifi-nar-bundles/nifi-ldap-iaa-providers-bundle/nifi-ldap-iaa-providers \
            -Dtest=org.apache.nifi.ldap.tenants.LdapUserGroupProviderTest#testReferencedGroupUsingReferencedAttribute

      - name: Run test WITH NonDex (should FAIL)
        working-directory: nifi
        run: |
          mvn edu.illinois:nondex-maven-plugin:2.1.1:nondex \
            -pl nifi-nar-bundles/nifi-ldap-iaa-providers-bundle/nifi-ldap-iaa-providers \
            -Dtest=org.apache.nifi.ldap.tenants.LdapUserGroupProviderTest#testReferencedGroupUsingReferencedAttribute
